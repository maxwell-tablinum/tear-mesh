# Builds release binaries when a version tag (v0.3.0) is pushed, smoke-tests each one on its own
# runner through the install script (a corrupted binary refused, install, re-run, uninstall), and
# creates a draft release with the binaries, the Claude Desktop extension (tearmesh.mcpb), install.sh and install.ps1 (filled with this version
# and the binaries' SHA-256) and SHA256SUMS. A person
# publishes the draft after checking it (see docs/testing.md, Releases).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: tearmesh-x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: tearmesh-aarch64-linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: tearmesh-x86_64-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: rustup update stable --no-self-update && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # ring and the bundled sqlite compile C for the target.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: stage
        shell: bash
        run: |
          mkdir dist
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp "target/${{ matrix.target }}/release/tearmesh$ext" "dist/${{ matrix.asset }}"
      # Through the install script, as the one-liner runs it, from a local copy of the release.
      - name: smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          a=${{ matrix.asset }}
          mkdir -p smoke/bad
          sha=$(sha256sum "dist/$a" | cut -d' ' -f1)
          sed -e "s/@SHA_X86_64_LINUX@/$sha/" -e "s/@SHA_AARCH64_LINUX@/$sha/" deploy/install.sh > smoke/install.sh
          cp "dist/$a" smoke/
          { cat "dist/$a"; echo corrupted; } > "smoke/bad/$a"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory smoke >/dev/null 2>&1 &
          for i in $(seq 10); do curl -fsI http://127.0.0.1:8765/install.sh >/dev/null && break; sleep 1; done
          if curl -fsSL http://127.0.0.1:8765/install.sh | sudo env TEARMESH_RELEASE_URL=http://127.0.0.1:8765/bad sh -s -- ci work 2>err; then
            echo "a corrupted binary was installed"; exit 1
          fi
          grep -q 'checksum mismatch: not installing' err
          test ! -e /usr/local/bin/tearmesh
          curl -fsSL http://127.0.0.1:8765/install.sh | sudo env TEARMESH_RELEASE_URL=http://127.0.0.1:8765 sh -s -- ci work
          for i in $(seq 30); do sudo tearmesh status >/dev/null 2>&1 && break; sleep 1; done
          sudo tearmesh status >/dev/null
          sudo tearmesh install ci work extra
          grep -q '^tm-extra = "extra"' /etc/tearmesh/config.toml
          curl -fsSL http://127.0.0.1:8765/install.sh | sudo sh -s -- --uninstall --yes
          ! id tm-work && ! id tm-extra && test ! -e /usr/local/bin/tearmesh
      - name: smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $a = '${{ matrix.asset }}'
          New-Item -ItemType Directory smoke\bad | Out-Null
          $sha = (Get-FileHash -Algorithm SHA256 "dist\$a").Hash
          (Get-Content -Raw deploy\install.ps1).Replace('@SHA_X86_64_WINDOWS@', $sha) | Set-Content smoke\install.ps1
          Copy-Item "dist\$a" smoke\
          [IO.File]::WriteAllBytes("$pwd\smoke\bad\$a", [IO.File]::ReadAllBytes("$pwd\dist\$a") + [byte[]](1, 2, 3))
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'smoke' -PassThru
          foreach ($i in 1..10) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/install.ps1 | Out-Null; break } catch { Start-Sleep 1 } }
          $script = [scriptblock]::Create((irm http://127.0.0.1:8765/install.ps1))
          $env:TEARMESH_RELEASE_URL = 'http://127.0.0.1:8765/bad'
          $refused = $false
          try { & $script -Machine ci -Boundaries work } catch { $refused = $_.Exception.Message -match 'checksum mismatch: not installing' }
          if (-not $refused) { throw "a corrupted binary wasn't refused" }
          if (Get-Service tearmesh -ErrorAction SilentlyContinue) { throw "the refused install left a service" }
          $env:TEARMESH_RELEASE_URL = 'http://127.0.0.1:8765'
          & $script -Machine ci -Boundaries work
          if ((Get-Service tearmesh).Status -ne 'Running') { throw "service not running" }
          # -Uninstall asks for confirmation, so CI uninstalls with --yes from the dist copy.
          & "dist\$a" uninstall --yes
          if ($LASTEXITCODE) { throw "uninstall failed" }
          if (Get-LocalUser tm-work -ErrorAction SilentlyContinue) { throw "uninstall left tm-work" }
          Stop-Process $srv
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The Claude Desktop extension (section 18.7): no binary inside, so it is built once, here.
      - run: adapters/claude-desktop/pack.sh dist/tearmesh.mcpb
      - run: cd dist && sha256sum tearmesh-* tearmesh.mcpb > SHA256SUMS
      # The scripts pin this version and the binaries' sums; their own sums go in SHA256SUMS too.
      - name: fill the install scripts
        run: |
          sum() { s=$(awk -v f="$1" '$2 == f { print $1 }' dist/SHA256SUMS); test "${#s}" = 64; echo "$s"; }
          x86=$(sum tearmesh-x86_64-linux)
          arm=$(sum tearmesh-aarch64-linux)
          win=$(sum tearmesh-x86_64-windows.exe)
          for s in install.sh install.ps1; do
            sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/" -e "s/@SHA_X86_64_LINUX@/$x86/" \
              -e "s/@SHA_AARCH64_LINUX@/$arm/" -e "s/@SHA_X86_64_WINDOWS@/$win/" "deploy/$s" > "dist/$s"
          done
          if grep -n '@[A-Z0-9_]*@' dist/install.sh dist/install.ps1; then echo "placeholders left"; exit 1; fi
          cd dist && sha256sum install.sh install.ps1 >> SHA256SUMS
      # --notes-from-tag, not --generate-notes, which adds handles and compare links.
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --notes-from-tag dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
