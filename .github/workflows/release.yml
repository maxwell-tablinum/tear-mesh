# Builds release binaries when a version tag (v0.3.0) is pushed, smoke-tests each one on its own
# runner (install, re-run, uninstall), and creates a draft release with SHA256SUMS. A person
# publishes the draft after checking it (see docs/testing.md, Releases).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: tearmesh-x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: tearmesh-aarch64-linux }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: tearmesh-x86_64-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: rustup update stable --no-self-update && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # ring and the bundled sqlite compile C for the target.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      - name: stage
        shell: bash
        run: |
          mkdir dist
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp "target/${{ matrix.target }}/release/tearmesh$ext" "dist/${{ matrix.asset }}"
      - name: smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo "dist/${{ matrix.asset }}" install ci work
          for i in $(seq 30); do sudo tearmesh status >/dev/null 2>&1 && break; sleep 1; done
          sudo tearmesh status >/dev/null
          sudo tearmesh install ci work extra
          grep -q '^tm-extra = "extra"' /etc/tearmesh/config.toml
          sudo "dist/${{ matrix.asset }}" uninstall --yes work extra
          ! id tm-work
      - name: smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist\${{ matrix.asset }}" install ci work
          if ($LASTEXITCODE) { throw "install failed" }
          if ((Get-Service tearmesh).Status -ne 'Running') { throw "service not running" }
          & "dist\${{ matrix.asset }}" uninstall --yes work
          if ($LASTEXITCODE) { throw "uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum tearmesh-* > SHA256SUMS
      # --notes-from-tag, not --generate-notes, which adds handles and compare links.
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --notes-from-tag dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
