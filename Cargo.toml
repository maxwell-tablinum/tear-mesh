[package]
name = "tearmesh"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A peer-to-peer mesh that connects apps and agents on your own machines, kept inside boundaries."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
iroh = "1.3.0"
iroh-mdns-address-lookup = "0.6.0"
ratatui = "0.30.2"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
zeroize = "1"
tower-service = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["user", "fs", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

# bcrypt (owner key passphrases) is ~50x slower unoptimized; tests open keys often.
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3
